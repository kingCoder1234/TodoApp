server:
  port: 8080

spring:
  application:
    name: todoapp

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${MY_SECRET_JWT_KEY}
  access-token-expiration-seconds: 900
  issuer: "todoapp"

auth:
  refresh-token-days: ${REFRESH_TOKEN_DAYS}

app:
  pagination:
    default-size: 20
    max-size: 100
  cache:
    max-entries: 10000
    todo-list-ttl-minutes: 5
    todo-single-ttl-minutes: 30
    profile-ttl-minutes: 30
    version-ttl-minutes: 60

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace