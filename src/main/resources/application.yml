server:
  port: 8080

spring:
  application:
    name: todoapp

  datasource:
    url: YOUR_JDBC_URL
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: YOUR_JWT_SECRET_KEY
  access-token-expiration-seconds: 900
  issuer: "todoapp"

auth:
  refresh-token-days: 7

app:
  pagination:
    default-size: 20
    max-size: 100
  cache:
    todo-list-ttl-minutes: 5
    todo-single-ttl-minutes: 10
    profile-ttl-minutes: 30

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace